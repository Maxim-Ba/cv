apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-frontend
  namespace: cv-portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cv-frontend
  template:
    metadata:
      labels:
        app: cv-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: cv-frontend
          image: 3224142123/cv-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: BACKEND_URL
              value: "http://cv-backend:3333"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
