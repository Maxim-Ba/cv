<div class="education-list">
  @if (isLoading() && !education().length) {
    @for (card of skeletonCards; track $index) {
      <article class="education-card education-card--skeleton" aria-hidden="true">
        <span class="cv-skeleton education-card__skeleton-year"></span>
        <span class="cv-skeleton education-card__skeleton-course"></span>
        <span class="cv-skeleton education-card__skeleton-org"></span>
      </article>
    }
  } @else {
    @for (eduItem of education(); track eduItem.id) {
      <article class="education-card">
        <span class="education-card__year">{{ 'education.year' | transloco: { year: eduItem.year } }}</span>
        <h3 class="education-card__course">{{ eduItem.course }}</h3>
        <p class="education-card__org">{{ eduItem.organization }}</p>
      </article>
    }
  }
</div>
