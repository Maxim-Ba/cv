<div class="hero">
  <div class="hero__avatar">
    <img
      class="hero__avatar-image"
      src="assets/img/I%20HH.jpeg"
      [alt]="hero()?.fullName ?? 'CV'"
      width="96"
      height="96"
    />
  </div>
  <div class="hero__body">
    @if (hero(); as data) {
      <p class="hero__greeting">{{ data.greeting }}</p>
      <h1 class="hero__name">{{ data.fullName }}</h1>
      <p class="hero__role">{{ data.title }}</p>
      <p class="hero__pitch">{{ data.pitch }}</p>
    }
    <div class="hero__actions">
      <app-gitlab-link></app-gitlab-link>
      <a
        mat-stroked-button
        class="hero__action-btn"
        [matTooltip]="'hero.telegramTooltip' | transloco"
        [href]="links.telegram.href"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="hero__action-icon" aria-hidden="true">
          <img width="18" height="18" src="assets/icons/telegram.svg" [alt]="links.telegram.label" />
        </span>
        {{ 'hero.telegram' | transloco }}
      </a>
      <app-contact-me variant="hero"></app-contact-me>
      <button
        mat-flat-button
        color="primary"
        class="hero__action-btn"
        [matTooltip]="'hero.downloadTooltip' | transloco"
        [disabled]="downloadCvService.isDownloading()"
        (click)="downloadCvService.downloadCV()"
      >
        <span class="hero__action-icon" aria-hidden="true">
          @if (downloadCvService.isDownloading()) {
            <mat-spinner diameter="18"></mat-spinner>
          } @else {
            <mat-icon fontIcon="download"></mat-icon>
          }
        </span>
        {{ 'hero.downloadCv' | transloco }}
      </button>
    </div>
  </div>
</div>
