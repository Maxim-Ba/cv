@if (notifyService.isAvailable()) {
  @if (variant === 'hero') {
  <button
    mat-stroked-button
    class="contact-me-btn contact-me-btn--hero hero__action-btn"
    (click)="openDialog()"
  >
    <span class="hero__action-icon" aria-hidden="true">
      <mat-icon fontIcon="mail"></mat-icon>
    </span>
    {{ 'hero.writeMe' | transloco }}
  </button>
  } @else {
  <button
    mat-flat-button
    class="contact-me-btn"
    (click)="openDialog()"
  >
    {{ 'contact.button' | transloco }}
  </button>
  }
}
<ng-template let-data #modal>
  <h2 mat-dialog-title class="title">{{ 'contact.title' | transloco }}</h2>
  <mat-dialog-content>
    <form class="form" [formGroup]="feedbackForm" (ngSubmit)="send()" id="feedback">
      <app-form-field-item
        [hint]="emailHint"
        [placeholder]="'contact.emailPlaceholder' | transloco"
        name="email"
        formControlName="email"
        label="Email"
        type="email"
        [validator]="this.feedbackForm.controls.email.validator"
      ></app-form-field-item>
      <app-form-field-item
        [placeholder]="'contact.namePlaceholder' | transloco"
        name="name"
        formControlName="name"
        [label]="'contact.nameLabel' | transloco"
        [hint]="nameHint"
        [validator]="this.feedbackForm.controls.name.validator"
      ></app-form-field-item>
      <app-form-textarea-item
        [hint]="messageHint"
        [placeholder]="'contact.messagePlaceholder' | transloco"
        name="message"
        formControlName="message"
        [validator]="this.feedbackForm.controls.message.validator"
      ></app-form-textarea-item>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
    <button type="button" (click)="closeDialog()" mat-raised-button [mat-dialog-close]="data">
      {{ 'contact.close' | transloco }}
    </button>
    <button color="primary" type="submit" form="feedback" mat-flat-button [disabled]="isSending()">
      {{ isSending() ? ('contact.sending' | transloco) : ('contact.send' | transloco) }}
    </button>
  </mat-dialog-actions>
</ng-template>
