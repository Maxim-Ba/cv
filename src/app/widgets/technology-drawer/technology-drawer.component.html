<div
  class="backdrop"
  [class.backdrop-visible]="technologiesService.isOpen"
  (click)="close()"
>
</div>
<div
  class="technology-drawer"
  [class.transition-on]="technologiesService.isOpen"
>
  <p class="title">{{ technologiesService.title }}</p>
  <p class="description">{{ technologiesService.description }}</p>
  @if (technologiesService.tags.length) {
  <div class="tags-wrapper">
    <span class="tags-wrapper__label">Теги:</span>
    <div class="tags">
      @for (tag of technologiesService.tags; track tag.id) {
      <span
        class="technology-drawer__tag"
        [style.background-color]="tag.hexColor ?? ''"
      >{{ tag.name }}</span>
      }
    </div>
  </div>
  }
  <button (click)="close()">close</button>
</div>
