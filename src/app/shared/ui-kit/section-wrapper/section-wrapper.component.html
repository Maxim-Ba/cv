<section
  [id]="sectionId"
  appMargins
  appCvReveal
  [class.cv-section]="!isHero"
  [class.cv-section--hero]="isHero"
>
  @if (sectionTitle) {
    <h2 class="cv-section__title">{{ sectionTitle }}</h2>
  }
  <div [class.cv-card]="!isHero" [class.cv-section__content]="true">
    <ng-content></ng-content>
  </div>
</section>
